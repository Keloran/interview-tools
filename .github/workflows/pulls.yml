name: Pull Requests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - railway

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: SKIP_ENV_VALIDATION=true pnpm build
      - run: SKIP_ENV_VALIDATION=true pnpm lint
      - run: SKIP_ENV_VALIDATION=true pnpm test
      - name: Check calendar days west of UTC
        run: INTERVIEW_TEST_TIMEZONE=America/New_York pnpm exec vitest run test/lib.offers.test.ts test/components.offers.test.tsx test/lib.searchreport.test.ts test/lib.activitylog.test.ts
      - name: Check stale application transactions
        run: node --import tsx scripts/check-stale-closure.ts
      - name: Check offer transactions
        run: node --import tsx scripts/check-offer-transactions.ts
      - name: Check activity-log PDF output
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          node --import tsx scripts/check-activity-print.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-log-print-check
          path: /tmp/interview-tools-activity-print-*/*.*
  automerge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: test
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  update_release_draft:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

